<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1090" width="1500" height="1090" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1a202c">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#718096"/></marker>
    <style>
      .h{font-weight:600;font-size:13px}
      .t{font-size:16px;font-weight:600}
      .s{font-size:11px;fill:#4a5568}
      .m{font-family:Consolas, Menlo, monospace;font-size:11px}
      .deny{fill:#c53030;font-size:11.5px;font-weight:600}
      .num{fill:#fff;font-weight:700;font-size:12px}
      .ln{stroke:#1a202c;stroke-width:1.8;fill:none}
    </style>
  </defs>
  <rect width="1500" height="1090" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="34" font-size="20" font-weight="700">CyberArk Secure Workload Access (SPIFFE) → Microsoft Entra ID → Azure Key Vault</text>
  <text x="30" y="56" class="s" font-size="12.5">Lab: github.com/nirmal-dhanaraj/swa-azure-federation · the workload holds no password, key or client secret · prod shown in detail, dev is identical with its own names</text>

  <!-- ===== Azure VM ===== -->
  <rect x="30" y="80" width="620" height="645" rx="10" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/>
  <text x="45" y="102" class="t">Azure VM  swa-docker-vm</text>
  <text x="45" y="120" class="s">Ubuntu · Australia East · subnet with Microsoft.KeyVault service endpoint · inbound: SSH only</text>

  <!-- k3s -->
  <rect x="55" y="135" width="570" height="150" rx="8" fill="#fffaf0" stroke="#c05621" stroke-width="1.3"/>
  <text x="70" y="156" class="h">container swa-k3s (k3s v1.35) — SWA Servers (vendor helm chart)</text>
  <rect x="75" y="172" width="255" height="95" rx="6" fill="#fff" stroke="#c05621"/>
  <text x="90" y="194" class="h">SWA Server · ns swa-dev</text>
  <text x="90" y="214">server group sg-k3s-dev</text>
  <text x="90" y="232">NodePort 30943 → host :18543</text>
  <text x="90" y="252" class="s">mTLS to dev agents</text>
  <rect x="350" y="172" width="255" height="95" rx="6" fill="#fff" stroke="#c05621" stroke-width="1.6"/>
  <text x="365" y="194" class="h">SWA Server · ns swa-prod</text>
  <text x="365" y="214">server group sg-k3s-prod</text>
  <text x="365" y="232">NodePort 30843 → host :18443</text>
  <text x="365" y="252" class="s">mTLS to prod agents</text>

  <!-- wl-dev (summary) -->
  <rect x="55" y="315" width="275" height="395" rx="8" fill="#fff" stroke="#a0aec0" stroke-dasharray="6 4"/>
  <text x="70" y="337" class="h" fill="#4a5568">container wl-dev (= dev machine)</text>
  <text x="70" y="372" fill="#4a5568">Same flow as prod, with:</text>
  <text x="70" y="398">SWA Agent  cert CN=ng-dev</text>
  <text x="70" y="420" class="m">spiffe://dev.mylab.swa.example.com/</text>
  <text x="70" y="436" class="m">  ng-dev/workload/swa-demo-sa</text>
  <text x="70" y="462">→ trust domain dev.mylab.swa.example.com</text>
  <text x="70" y="482">→ identity id-swa-dev-mylab (fic-swa-dev)</text>
  <text x="70" y="502">→ vault kv-swa-nirmal-dev / swa-dev-demo</text>
  <text x="70" y="540" class="deny">✗ dev JWT → prod identity: AADSTS700211</text>
  <text x="70" y="560" class="deny">✗ dev token → prod vault: 403</text>
  <text x="70" y="580" class="deny">✗ root in wl-dev → no JWT-SVID</text>

  <!-- wl-prod -->
  <rect x="350" y="315" width="275" height="395" rx="8" fill="#fff" stroke="#2d3748" stroke-width="1.5"/>
  <text x="365" y="337" class="h">container wl-prod (= prod machine)</text>
  <rect x="370" y="352" width="235" height="125" rx="6" fill="#ebf8ff" stroke="#2b6cb0"/>
  <text x="385" y="374" class="h">Workload</text>
  <text x="385" y="394">Linux user swa-demo-sa</text>
  <text x="385" y="412">swa-agent CLI (demo) or your app</text>
  <text x="385" y="430">(Azure SDK ClientAssertionCredential)</text>
  <text x="385" y="452" class="s">no password, key or client secret</text>
  <rect x="370" y="520" width="235" height="120" rx="6" fill="#ebf8ff" stroke="#2b6cb0"/>
  <text x="385" y="542" class="h">SWA Agent</text>
  <text x="385" y="562">x509pop node cert CN=ng-prod</text>
  <text x="385" y="580" class="m">/run/swa-agent/api.sock</text>
  <text x="385" y="600">identifies caller from /proc:</text>
  <text x="385" y="618">user · uid · path · sha256</text>
  <text x="370" y="662" class="s">SPIFFE ID (JWT sub):</text>
  <text x="370" y="677" class="m">spiffe://prod.mylab.swa.example.com/</text>
  <text x="370" y="691" class="m">  ng-prod/workload/swa-demo-sa</text>
  <text x="370" y="705" class="deny" font-size="10.5">✗ root in wl-prod → no JWT-SVID</text>

  <!-- ===== CyberArk tenant ===== -->
  <rect x="720" y="80" width="750" height="210" rx="10" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="735" y="102" class="t">CyberArk Secrets Manager SaaS — Secure Workload Access</text>
  <text x="1455" y="102" class="s" text-anchor="end">tiger-prod.secretsmgr.cyberark.cloud</text>
  <rect x="735" y="118" width="350" height="160" rx="6" fill="#fff" stroke="#2b6cb0"/>
  <text x="750" y="140" class="h">Trust domain prod.mylab.swa.example.com</text>
  <text x="750" y="160">OIDC issuer (= JWT iss):</text>
  <text x="750" y="176" class="m">https://tiger-prod.secretsmgr.cyberark.cloud</text>
  <text x="750" y="190" class="m">/api/swa/trust-domains/prod.mylab.swa.example.com</text>
  <text x="750" y="210">publishes /.well-known/openid-configuration</text>
  <text x="750" y="228">+ JWKS publicly → Entra verifies signatures</text>
  <text x="750" y="250" class="s">dev: …/trust-domains/dev.mylab.swa.example.com</text>
  <text x="750" y="266" class="s">(same tenant host for both environments)</text>
  <rect x="1105" y="118" width="350" height="160" rx="6" fill="#fff" stroke="#2b6cb0"/>
  <text x="1120" y="140" class="h">Node group ng-prod — registration policy</text>
  <text x="1120" y="162" class="m">user=="swa-demo-sa" &amp;&amp; sha256==&lt;client&gt;</text>
  <text x="1120" y="180" class="m">user=="swa-demo-sa" &amp;&amp; path==swa-agent</text>
  <text x="1120" y="202">either rule matches → JWT-SVID, else denied</text>
  <text x="1120" y="226">JWT-SVID: RS512 (accepted by Entra), ~5 min</text>
  <text x="1120" y="244">aud = what the workload asks for:</text>
  <text x="1120" y="262" class="m">api://AzureADTokenExchange</text>

  <!-- ===== Entra ID ===== -->
  <rect x="720" y="325" width="750" height="240" rx="10" fill="#f5f0ff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="735" y="347" class="t">Microsoft Entra ID</text>
  <text x="1455" y="347" class="s" text-anchor="end">tenant dc5c35ed-… · login.microsoftonline.com/&lt;tenant&gt;/oauth2/v2.0/token</text>
  <rect x="735" y="362" width="350" height="190" rx="6" fill="#fff" stroke="#6b46c1" stroke-width="1.6"/>
  <text x="750" y="384" class="h">Managed identity id-swa-prod-mylab</text>
  <text x="750" y="402" class="s">user-assigned · client id 0537c285-… · rg-nirmal-lab</text>
  <text x="750" y="426" class="h">Federated credential fic-swa-prod</text>
  <text x="750" y="446" class="m">issuer   = …/trust-domains/prod.mylab.swa.example.com</text>
  <text x="750" y="464" class="m">subject  = spiffe://prod.mylab.swa.example.com/</text>
  <text x="750" y="478" class="m">           ng-prod/workload/swa-demo-sa</text>
  <text x="750" y="496" class="m">audience = api://AzureADTokenExchange</text>
  <text x="750" y="518">all three must match the JWT exactly</text>
  <text x="750" y="538" class="deny">✗ JWT with aud=conjur: AADSTS700212</text>
  <rect x="1105" y="362" width="350" height="190" rx="6" fill="#fff" stroke="#6b46c1"/>
  <text x="1120" y="384" class="h">Managed identity id-swa-dev-mylab</text>
  <text x="1120" y="402" class="s">user-assigned · client id ddd03023-…</text>
  <text x="1120" y="426" class="h">Federated credential fic-swa-dev</text>
  <text x="1120" y="446" class="m">issuer   = …/trust-domains/dev.mylab.swa.example.com</text>
  <text x="1120" y="464" class="m">subject  = spiffe://dev.mylab.swa.example.com/</text>
  <text x="1120" y="478" class="m">           ng-dev/workload/swa-demo-sa</text>
  <text x="1120" y="496" class="m">audience = api://AzureADTokenExchange</text>
  <text x="1120" y="538" class="deny">✗ prod JWT → this identity: AADSTS700211</text>

  <!-- ===== Key Vault ===== -->
  <rect x="720" y="595" width="750" height="130" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="1.5"/>
  <text x="735" y="617" class="t">Azure Key Vault</text>
  <text x="1455" y="617" class="s" text-anchor="end">rg-nirmal-lab · access-policy model · firewall: VM subnet + admin IP only</text>
  <rect x="735" y="630" width="350" height="85" rx="6" fill="#fff" stroke="#2f855a" stroke-width="1.6"/>
  <text x="750" y="652" class="h">kv-swa-nirmal-prod</text>
  <text x="750" y="672">secret swa-prod-demo</text>
  <text x="750" y="692">access policy: Get → id-swa-prod-mylab only</text>
  <rect x="1105" y="630" width="350" height="85" rx="6" fill="#fff" stroke="#2f855a"/>
  <text x="1120" y="652" class="h">kv-swa-nirmal-dev</text>
  <text x="1120" y="672">secret swa-dev-demo · Get → id-swa-dev-mylab</text>
  <text x="1120" y="696" class="deny">✗ prod token → this vault: 403</text>

  <!-- ===== Arrows ===== -->
  <!-- 0 setup: server <-> tenant -->
  <path d="M605,220 L733,220" stroke="#718096" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-start="url(#g)" marker-end="url(#g)"/>
  <circle cx="670" cy="220" r="11" fill="#718096"/><text x="670" y="224" class="num" text-anchor="middle">0</text>
  <!-- 1 workload -> agent -->
  <path d="M487,477 L487,518" class="ln" marker-end="url(#a)"/>
  <circle cx="487" cy="497" r="11" fill="#2b6cb0"/><text x="487" y="501" class="num" text-anchor="middle">1</text>
  <!-- 2 agent <-> server -->
  <path d="M370,580 L360,580 L360,269" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <circle cx="360" cy="295" r="11" fill="#2b6cb0"/><text x="360" y="299" class="num" text-anchor="middle">2</text>
  <!-- 3 workload -> Entra -->
  <path d="M605,385 L733,405" class="ln" marker-end="url(#a)"/>
  <circle cx="669" cy="395" r="11" fill="#2b6cb0"/><text x="669" y="399" class="num" text-anchor="middle">3</text>
  <!-- 4 Entra -> issuer discovery / JWKS -->
  <path d="M910,362 L910,280" class="ln" marker-end="url(#a)"/>
  <circle cx="910" cy="308" r="11" fill="#2b6cb0"/><text x="910" y="312" class="num" text-anchor="middle">4</text>
  <!-- 5 Entra -> workload (token) -->
  <path d="M735,455 L607,428" class="ln" marker-end="url(#a)"/>
  <circle cx="671" cy="441" r="11" fill="#2b6cb0"/><text x="671" y="445" class="num" text-anchor="middle">5</text>
  <!-- 6 workload -> Key Vault -->
  <path d="M605,465 L733,668" class="ln" marker-end="url(#a)"/>
  <circle cx="669" cy="566" r="11" fill="#2b6cb0"/><text x="669" y="570" class="num" text-anchor="middle">6</text>

  <!-- ===== Steps ===== -->
  <rect x="30" y="745" width="1440" height="330" rx="10" fill="#fafafa" stroke="#cbd5e0"/>
  <text x="50" y="770" class="t">Flow (prod)</text>

  <g transform="translate(50,795)">
    <circle cx="9" cy="-4" r="10" fill="#718096"/><text x="9" y="0" class="num" text-anchor="middle">0</text>
    <text x="28" y="0"><tspan font-weight="600">Setup.</tspan> The SWA Server authenticates to the tenant with its k3s service-account token, publishes the trust domain's</text>
    <text x="28" y="17">signing keys (JWKS) and syncs node-group policies. The agent attests its node with the x509pop cert CN=ng-prod.</text>

    <circle cx="9" cy="41" r="10" fill="#2b6cb0"/><text x="9" y="45" class="num" text-anchor="middle">1</text>
    <text x="28" y="45">The workload (user swa-demo-sa) asks the local agent over the Unix socket for a JWT-SVID with audience</text>
    <text x="28" y="62">api://AzureADTokenExchange. It holds no credential of its own.</text>

    <circle cx="9" cy="86" r="10" fill="#2b6cb0"/><text x="9" y="90" class="num" text-anchor="middle">2</text>
    <text x="28" y="90">The agent reads the caller's user, path and sha256 from /proc; the SWA Server evaluates the ng-prod policy and returns</text>
    <text x="28" y="107">a signed JWT-SVID (~5 min): iss = trust domain URL, sub = SPIFFE ID, aud = api://AzureADTokenExchange.</text>

    <circle cx="9" cy="131" r="10" fill="#2b6cb0"/><text x="9" y="135" class="num" text-anchor="middle">3</text>
    <text x="28" y="135">The workload POSTs to Entra's token endpoint: client_id = id-swa-prod-mylab's client id, grant_type = client_credentials,</text>
    <text x="28" y="152">client_assertion = the JWT-SVID, scope = https://vault.azure.net/.default.</text>
  </g>

  <g transform="translate(770,795)">
    <circle cx="9" cy="-4" r="10" fill="#2b6cb0"/><text x="9" y="0" class="num" text-anchor="middle">4</text>
    <text x="28" y="0">Entra finds federated credential fic-swa-prod (iss + sub + aud match exactly), fetches the issuer's</text>
    <text x="28" y="17">OpenID configuration + JWKS from the tenant (public) and verifies the JWT signature.</text>

    <circle cx="9" cy="41" r="10" fill="#2b6cb0"/><text x="9" y="45" class="num" text-anchor="middle">5</text>
    <text x="28" y="45">Entra returns an access token for the managed identity id-swa-prod-mylab (aud = Key Vault, ~24 h).</text>

    <circle cx="9" cy="69" r="10" fill="#2b6cb0"/><text x="9" y="73" class="num" text-anchor="middle">6</text>
    <text x="28" y="73">The workload reads swa-prod-demo from kv-swa-nirmal-prod through the subnet's service endpoint;</text>
    <text x="28" y="90">the vault firewall allows the VM subnet and the access policy allows Get for id-swa-prod-mylab only.</text>

    <text x="0" y="122" class="h" fill="#c53030">Denied by design (./40-full-test.sh = 12/12 PASS)</text>
    <text x="0" y="141">✗ prod token → dev vault: 403   ✗ prod JWT → dev identity: AADSTS700211</text>
    <text x="0" y="158">✗ JWT with aud=conjur: AADSTS700212   ✗ root in the container: no JWT-SVID (SWA policy)</text>
  </g>

  <line x1="50" y1="985" x2="1450" y2="985" stroke="#cbd5e0"/>
  <text x="50" y="1008" class="h">Same pattern as CyberArk's AWS guide</text>
  <text x="50" y="1028">AWS IAM OIDC identity provider + role trust policy  →  Entra federated identity credential (issuer / subject / audience)</text>
  <text x="50" y="1046">AWS IAM role  →  user-assigned managed identity   ·   STS AssumeRoleWithWebIdentity  →  Entra token endpoint with client_assertion</text>
  <text x="50" y="1064">AWS policy on S3 / Secrets Manager  →  Key Vault access policy (or RBAC role "Key Vault Secrets User" on a single secret)</text>
</svg>
