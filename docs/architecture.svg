<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" width="1400" height="840" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a202c">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d3748"/></marker>
    <style>
      .zt{font-size:17px;font-weight:700}
      .zs{font-size:12px;fill:#4a5568}
      .bt{font-size:15px;font-weight:700}
      .bd{font-size:13px;fill:#2d3748}
      .bs{font-size:12px;fill:#4a5568}
      .ln{stroke:#2d3748;stroke-width:2;fill:none}
      .n{fill:#fff;font-weight:700;font-size:13px}
      .lg{font-size:13.5px}
    </style>
  </defs>
  <rect width="1400" height="840" fill="#fff"/>

  <text x="30" y="40" font-size="22" font-weight="700">Workload identity federation: CyberArk Secure Workload Access → Microsoft Azure</text>
  <text x="30" y="64" class="zs" font-size="13.5">A workload uses its attested SPIFFE identity to get an Azure access token, with no stored secrets.</text>

  <!-- Zone A: customer environment -->
  <rect x="30" y="90" width="540" height="465" rx="12" fill="#f7fafc" stroke="#718096" stroke-width="1.5"/>
  <text x="50" y="117" class="zt">Customer environment</text>
  <text x="50" y="136" class="zs">Azure VM · on-premises · other cloud · Kubernetes</text>

  <rect x="55" y="155" width="285" height="380" rx="10" fill="#fff" stroke="#a0aec0" stroke-dasharray="6 4"/>
  <text x="70" y="177" class="bs">Workload host</text>

  <rect x="80" y="190" width="235" height="100" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="197" y="222" class="bt" text-anchor="middle">Workload</text>
  <text x="197" y="244" class="bd" text-anchor="middle">application or service</text>
  <text x="197" y="264" class="bs" text-anchor="middle">stores no secrets</text>

  <rect x="80" y="400" width="235" height="110" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="197" y="432" class="bt" text-anchor="middle">SWA Agent</text>
  <text x="197" y="454" class="bd" text-anchor="middle">verifies which process is calling</text>
  <text x="197" y="474" class="bs" text-anchor="middle">(user, binary, hash)</text>

  <rect x="385" y="425" width="165" height="110" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="467" y="455" class="bt" text-anchor="middle">SWA Server</text>
  <text x="467" y="477" class="bd" text-anchor="middle">issues short-lived</text>
  <text x="467" y="495" class="bd" text-anchor="middle">SPIFFE identities</text>
  <text x="467" y="514" class="bs" text-anchor="middle">(JWT-SVID)</text>

  <!-- CyberArk -->
  <rect x="630" y="90" width="370" height="175" rx="12" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="815" y="122" class="zt" text-anchor="middle">CyberArk</text>
  <text x="815" y="143" class="bd" text-anchor="middle" font-weight="600">Secure Workload Access (SaaS)</text>
  <text x="815" y="175" class="bd" text-anchor="middle">Trust domain = OIDC issuer</text>
  <text x="815" y="196" class="bd" text-anchor="middle">publishes its public signing keys</text>
  <text x="815" y="226" class="bs" text-anchor="middle">workload registration policies</text>
  <text x="815" y="244" class="bs" text-anchor="middle">(which workloads get an identity)</text>

  <!-- Why it matters -->
  <rect x="1040" y="90" width="330" height="175" rx="12" fill="#fffff0" stroke="#d69e2e" stroke-width="1.3"/>
  <text x="1060" y="120" class="bt">Why it matters</text>
  <text x="1060" y="150" class="bd">•  No client secrets or certificates</text>
  <text x="1060" y="170" class="bd">   to store, share or rotate</text>
  <text x="1060" y="196" class="bd">•  Short-lived tokens only</text>
  <text x="1060" y="222" class="bd">•  Identity is based on what the</text>
  <text x="1060" y="242" class="bd">   workload is, not what it holds</text>

  <!-- Zone C: Azure -->
  <rect x="630" y="330" width="740" height="225" rx="12" fill="#f5f9ff" stroke="#0078d4" stroke-width="1.5"/>
  <text x="650" y="357" class="zt">Microsoft Azure</text>

  <rect x="650" y="370" width="340" height="165" rx="8" fill="#fff" stroke="#6b46c1" stroke-width="1.6"/>
  <text x="820" y="398" class="bt" text-anchor="middle">Microsoft Entra ID</text>
  <text x="820" y="420" class="bd" text-anchor="middle">User-assigned managed identity</text>
  <text x="820" y="446" class="bd" text-anchor="middle" font-weight="600">Federated credential</text>
  <text x="820" y="466" class="bs" text-anchor="middle">issuer = SWA trust domain</text>
  <text x="820" y="484" class="bs" text-anchor="middle">subject = workload SPIFFE ID</text>
  <text x="820" y="502" class="bs" text-anchor="middle">audience = api://AzureADTokenExchange</text>

  <rect x="1060" y="370" width="290" height="165" rx="8" fill="#fff" stroke="#2f855a" stroke-width="1.6"/>
  <text x="1205" y="410" class="bt" text-anchor="middle">Azure resources</text>
  <text x="1205" y="434" class="bd" text-anchor="middle">Key Vault · Storage · SQL · …</text>
  <text x="1205" y="466" class="bs" text-anchor="middle">access authorized by Azure RBAC</text>
  <text x="1205" y="484" class="bs" text-anchor="middle">for the managed identity</text>

  <!-- Arrows -->
  <!-- 1 workload -> agent -->
  <path d="M197,290 L197,397" class="ln" marker-end="url(#a)"/>
  <circle cx="197" cy="343" r="13" fill="#2b6cb0"/><text x="197" y="348" class="n" text-anchor="middle">1</text>
  <!-- 2 agent <-> server -->
  <path d="M316,470 L382,480" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <circle cx="350" cy="475" r="13" fill="#2b6cb0"/><text x="350" y="480" class="n" text-anchor="middle">2</text>
  <!-- 3 workload -> Entra -->
  <path d="M315,228 L647,415" class="ln" marker-end="url(#a)"/>
  <circle cx="480" cy="321" r="13" fill="#2b6cb0"/><text x="480" y="326" class="n" text-anchor="middle">3</text>
  <!-- 4 Entra -> CyberArk keys -->
  <path d="M820,370 L820,268" class="ln" marker-end="url(#a)"/>
  <circle cx="820" cy="286" r="13" fill="#2b6cb0"/><text x="820" y="291" class="n" text-anchor="middle">4</text>
  <!-- 5 Entra -> workload -->
  <path d="M650,470 L318,282" class="ln" marker-end="url(#a)"/>
  <circle cx="490" cy="379" r="13" fill="#2b6cb0"/><text x="490" y="384" class="n" text-anchor="middle">5</text>
  <!-- 6 workload -> Azure resource -->
  <path d="M315,205 L600,205 L600,305 L1205,305 L1205,367" class="ln" marker-end="url(#a)"/>
  <circle cx="1000" cy="305" r="13" fill="#2b6cb0"/><text x="1000" y="310" class="n" text-anchor="middle">6</text>

  <!-- Legend -->
  <rect x="30" y="585" width="1340" height="235" rx="12" fill="#fafafa" stroke="#cbd5e0"/>
  <text x="50" y="615" class="bt">Runtime flow</text>
  <g class="lg">
    <circle cx="62" cy="641" r="11" fill="#2b6cb0"/><text x="62" y="645.5" class="n" text-anchor="middle" font-size="12">1</text>
    <text x="84" y="646">The workload asks its local SWA Agent for an identity token (JWT-SVID) for Azure.</text>
    <circle cx="62" cy="671" r="11" fill="#2b6cb0"/><text x="62" y="675.5" class="n" text-anchor="middle" font-size="12">2</text>
    <text x="84" y="676">The agent attests the workload; the SWA Server issues a signed, short-lived JWT-SVID.</text>
    <circle cx="62" cy="701" r="11" fill="#2b6cb0"/><text x="62" y="705.5" class="n" text-anchor="middle" font-size="12">3</text>
    <text x="84" y="706">The workload presents the JWT-SVID to Entra ID to sign in as the managed identity.</text>
    <circle cx="62" cy="731" r="11" fill="#2b6cb0"/><text x="62" y="735.5" class="n" text-anchor="middle" font-size="12">4</text>
    <text x="84" y="736">Entra ID matches it to the federated credential and verifies it with CyberArk's public keys.</text>
    <circle cx="62" cy="761" r="11" fill="#2b6cb0"/><text x="62" y="765.5" class="n" text-anchor="middle" font-size="12">5</text>
    <text x="84" y="766">Entra ID returns a short-lived Azure access token.</text>
    <circle cx="62" cy="791" r="11" fill="#2b6cb0"/><text x="62" y="795.5" class="n" text-anchor="middle" font-size="12">6</text>
    <text x="84" y="796">The workload calls the Azure resource with that token; Azure RBAC authorizes the request.</text>
  </g>

  <line x1="760" y1="605" x2="760" y2="800" stroke="#e2e8f0"/>
  <text x="790" y="615" class="bt">One-time setup</text>
  <g class="lg">
    <circle cx="802" cy="641" r="11" fill="#718096"/><text x="802" y="645.5" class="n" text-anchor="middle" font-size="12">A</text>
    <text x="824" y="646">CyberArk: deploy the SWA Server and agents, and define</text>
    <text x="824" y="666">which workloads may receive an identity.</text>
    <circle cx="802" cy="701" r="11" fill="#718096"/><text x="802" y="705.5" class="n" text-anchor="middle" font-size="12">B</text>
    <text x="824" y="706">Entra ID: create a managed identity with a federated</text>
    <text x="824" y="726">credential that trusts the workload's SPIFFE ID.</text>
    <circle cx="802" cy="761" r="11" fill="#718096"/><text x="802" y="765.5" class="n" text-anchor="middle" font-size="12">C</text>
    <text x="824" y="766">Azure: grant that identity only the role it needs</text>
    <text x="824" y="786">on the target resource (least privilege).</text>
  </g>
</svg>
