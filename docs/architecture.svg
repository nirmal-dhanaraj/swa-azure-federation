<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 735" width="1240" height="735" font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#1a202c">
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2386a3"/><stop offset="1" stop-color="#145d74"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2d3748"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#718096"/></marker>
    <style>
      .ln{stroke:#2d3748;stroke-width:2;fill:none}
      .dl{stroke:#718096;stroke-width:1.8;fill:none;stroke-dasharray:6 5}
      .bx{font-size:20px;font-weight:600;fill:#fff}
      .zt{font-size:22px;font-weight:500}
      .n{fill:#fff;font-weight:700;font-size:16px}
      .lg{font-size:14.5px;fill:#2d3748}
    </style>
  </defs>
  <rect width="1240" height="735" fill="#fff"/>

  <!-- ===== Kubernetes cluster ===== -->
  <rect x="20" y="20" width="580" height="500" rx="8" fill="#e4f3f0" stroke="#c3e0d9" stroke-width="1.5"/>
  <rect x="36" y="34" width="36" height="36" rx="6" fill="#2b5fb4"/>
  <polygon points="54,40 65,45 67,57 60,66 48,66 41,57 43,45" fill="none" stroke="#fff" stroke-width="2"/>
  <circle cx="54" cy="54" r="4" fill="#fff"/>
  <text x="84" y="61" class="zt">Kubernetes Cluster</text>

  <!-- Workload pod -->
  <rect x="70" y="105" width="170" height="80" rx="4" fill="url(#tb)"/>
  <text x="155" y="139" class="bx" text-anchor="middle">Workload</text>
  <text x="155" y="165" class="bx" text-anchor="middle">(Pod)</text>
  <polygon points="226,112 234,116 234,125 226,129 218,125 218,116" fill="none" stroke="#fff" stroke-width="1.5"/>
  <polyline points="218,116 226,120 234,116" fill="none" stroke="#fff" stroke-width="1.5"/>
  <line x1="226" y1="120" x2="226" y2="129" stroke="#fff" stroke-width="1.5"/>

  <!-- SWA Agent -->
  <rect x="210" y="250" width="115" height="80" rx="4" fill="url(#tb)"/>
  <text x="267" y="284" class="bx" text-anchor="middle">SWA</text>
  <text x="267" y="310" class="bx" text-anchor="middle">Agent</text>
  <circle cx="311" cy="262" r="6" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="311" cy="262" r="2" fill="#fff"/>

  <!-- SWA Server -->
  <rect x="395" y="250" width="180" height="80" rx="4" fill="url(#tb)"/>
  <rect x="412" y="268" width="26" height="40" rx="2" fill="none" stroke="#fff" stroke-width="1.6"/>
  <line x1="417" y1="277" x2="433" y2="277" stroke="#fff" stroke-width="1.6"/>
  <line x1="417" y1="285" x2="433" y2="285" stroke="#fff" stroke-width="1.6"/>
  <circle cx="425" cy="299" r="2.5" fill="#fff"/>
  <text x="510" y="284" class="bx" text-anchor="middle">SWA</text>
  <text x="510" y="310" class="bx" text-anchor="middle">Server</text>

  <!-- ===== Idira SaaS ===== -->
  <rect x="628" y="228" width="214" height="134" rx="8" fill="#fff" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="735" y="261" text-anchor="middle" font-size="19" font-weight="700" fill="#1a365d">Idira</text>
  <text x="735" y="286" text-anchor="middle" font-size="15.5">Secure Workload</text>
  <text x="735" y="306" text-anchor="middle" font-size="15.5">Access (SaaS)</text>
  <text x="735" y="338" text-anchor="middle" font-size="12.5" fill="#4a5568">OIDC issuer · public keys</text>

  <!-- ===== Microsoft Azure ===== -->
  <rect x="870" y="20" width="350" height="500" rx="8" fill="#e9f2fc" stroke="#bcd6f2" stroke-width="1.5"/>
  <rect x="886" y="34" width="36" height="36" rx="6" fill="#0078d4"/>
  <path d="M895,60 a6,6 0 0 1 1,-12 a8,8 0 0 1 15,2 a5,5 0 0 1 2,10 z" fill="#fff"/>
  <text x="934" y="61" class="zt">Microsoft Azure</text>

  <!-- Entra ID -->
  <rect x="900" y="85" width="300" height="170" rx="4" fill="#fff" stroke="#0078d4" stroke-width="1.8"/>
  <rect x="912" y="97" width="40" height="40" rx="4" fill="#0078d4"/>
  <rect x="919" y="108" width="26" height="18" rx="2" fill="none" stroke="#fff" stroke-width="1.6"/>
  <circle cx="927" cy="115" r="3" fill="#fff"/>
  <line x1="933" y1="113" x2="941" y2="113" stroke="#fff" stroke-width="1.5"/>
  <line x1="933" y1="119" x2="941" y2="119" stroke="#fff" stroke-width="1.5"/>
  <text x="964" y="125" font-size="20" font-weight="500">Microsoft Entra ID</text>
  <rect x="925" y="155" width="250" height="38" fill="#fff" stroke="#8a9aa9"/>
  <text x="1050" y="180" text-anchor="middle" font-size="17">Managed Identity</text>
  <rect x="925" y="203" width="250" height="38" fill="#fff" stroke="#8a9aa9"/>
  <text x="1050" y="228" text-anchor="middle" font-size="17">Federated Credential</text>

  <!-- Azure services -->
  <rect x="900" y="320" width="300" height="180" rx="4" fill="#f4f6f8" stroke="#8a9aa9" stroke-width="1.5"/>
  <path d="M918,352 a6,6 0 0 1 1,-12 a8,8 0 0 1 15,2 a5,5 0 0 1 2,10 z" fill="none" stroke="#4a5568" stroke-width="1.5"/>
  <text x="948" y="353" font-size="20" font-weight="500">Azure Services</text>
  <rect x="1015" y="372" width="70" height="70" rx="6" fill="#0078d4"/>
  <circle cx="1040" cy="400" r="9" fill="none" stroke="#fff" stroke-width="3"/>
  <line x1="1049" y1="400" x2="1068" y2="400" stroke="#fff" stroke-width="3"/>
  <line x1="1062" y1="400" x2="1062" y2="409" stroke="#fff" stroke-width="3"/>
  <line x1="1068" y1="400" x2="1068" y2="407" stroke="#fff" stroke-width="3"/>
  <text x="1050" y="475" text-anchor="middle" font-size="18" font-weight="500">Azure Key Vault</text>

  <!-- ===== Arrows ===== -->
  <!-- 1 workload <-> agent (local socket) -->
  <path d="M165,188 L165,290 L207,290" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="175" y="210" font-size="12.5">local</text>
  <text x="175" y="225" font-size="12.5">Unix</text>
  <text x="175" y="240" font-size="12.5">socket</text>
  <circle cx="137" cy="262" r="15" fill="#1a3a52"/><text x="137" y="268" class="n" text-anchor="middle">1</text>

  <!-- 2 agent <-> server -->
  <path d="M325,278 L392,278" class="ln" marker-end="url(#a)"/>
  <path d="M392,303 L328,303" class="ln" marker-end="url(#a)"/>
  <circle cx="360" cy="348" r="15" fill="#1a3a52"/><text x="360" y="354" class="n" text-anchor="middle">2</text>

  <!-- 3 workload -> Entra -->
  <path d="M240,128 L897,128" class="ln" marker-end="url(#a)"/>
  <circle cx="470" cy="100" r="15" fill="#0078d4"/><text x="470" y="106" class="n" text-anchor="middle">3</text>
  <!-- 4 Entra -> workload -->
  <path d="M900,165 L243,165" class="ln" marker-end="url(#a)"/>
  <circle cx="470" cy="193" r="15" fill="#0078d4"/><text x="470" y="199" class="n" text-anchor="middle">4</text>

  <!-- 5 workload -> Key Vault -->
  <path d="M100,185 L100,460 L897,460" class="ln" marker-end="url(#a)"/>
  <circle cx="470" cy="490" r="15" fill="#0078d4"/><text x="470" y="496" class="n" text-anchor="middle">5</text>

  <!-- dashed: SWA Server -> Idira ; Entra -> Idira public keys -->
  <path d="M575,295 L625,295" class="dl" marker-end="url(#g)"/>
  <path d="M935,255 L935,295 L845,295" class="dl" marker-end="url(#g)"/>

  <!-- ===== Legend ===== -->
  <line x1="20" y1="548" x2="1220" y2="548" stroke="#e2e8f0"/>
  <g class="lg">
    <circle cx="36" cy="574" r="11" fill="#1a3a52"/><text x="36" y="579" class="n" font-size="13" text-anchor="middle">1</text>
    <text x="56" y="579">The workload asks the SWA Agent on its node for an identity token (JWT-SVID) for Azure.</text>
    <circle cx="36" cy="602" r="11" fill="#1a3a52"/><text x="36" y="607" class="n" font-size="13" text-anchor="middle">2</text>
    <text x="56" y="607">The agent attests the workload; the SWA Server issues a signed, short-lived JWT-SVID (its SPIFFE ID).</text>
    <circle cx="36" cy="630" r="11" fill="#0078d4"/><text x="36" y="635" class="n" font-size="13" text-anchor="middle">3</text>
    <text x="56" y="635">The workload presents the JWT-SVID to Entra ID for the managed identity. Entra checks it against the federated credential</text>
    <text x="56" y="654">(issuer, SPIFFE ID, audience) and verifies its signature with Idira's public keys (dashed line).</text>
    <circle cx="36" cy="680" r="11" fill="#0078d4"/><text x="36" y="685" class="n" font-size="13" text-anchor="middle">4</text>
    <text x="56" y="685">Entra ID returns a short-lived Azure access token. No secret is stored anywhere.</text>
    <circle cx="36" cy="708" r="11" fill="#0078d4"/><text x="36" y="713" class="n" font-size="13" text-anchor="middle">5</text>
    <text x="56" y="713">The workload calls Azure Key Vault (or any Azure service) with the token; Azure RBAC authorizes the request.</text>
  </g>
</svg>
